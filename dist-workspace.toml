[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.4"
# CI backends to support
ci = "github"
# release.yml is hand-edited (workflow_dispatch for prereleases)
allow-dirty = ["ci"]
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]

# dist 0.30.4 defaults aarch64-apple-darwin to macos-14, which GitHub retired.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

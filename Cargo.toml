[package]
name = "git-subrepo"
authors = ["Tin Lai <tin@tinyiu.com>"]
description = "Git subrepo workflow"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/soraxas/git-subrepo-rs.git"
version = "0.0.1"

[dependencies]
anyhow              = "1.0.102"
clap                = { version = "4.5.60", features = [ "derive" ] }
thiserror           = "2.0.18"
tokio               = { version = "1.49.0", features = [ "full" ] }
indicatif           = "0.17"
git2                = { version = "0.20.4", features = ["https", "ssh"] }
colored             = "3.1.1"

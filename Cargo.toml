[package]
name = "git-subrepo"
authors = ["Tin Lai <tin@tinyiu.com>"]
description = "Git subrepo workflow"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/soraxas/git-subrepo-rs.git"
version = "0.0.1"

[dependencies]
anyhow              = "1.0.102"
usage               = { package = "usage-rs", version = "6.12.0", features = [ "completions" ] }
thiserror           = "2.0.18"
tokio               = { version = "1.49.0", features = [ "full" ] }
indicatif           = "0.17"
dialoguer           = "0.11"
colored             = "3.1.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
